name: Deploy Admin Production

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lfeenteam/lfeen-admin-web

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    # مهم:
    # لو GOOGLE_MAPS_API_KEY موجودة كـ Environment Secret
    # داخل Lfeen-Production لازم نحط environment هنا أيضًا.
    environment: Lfeen-Production

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20


      - name: Create Production Environment
        working-directory: LFEEN.FrontEnd/package/main
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          cat > src/environments/environment.prod.ts <<EOF
          export const environment = {
            production: true,
            apiBaseUrl: 'https://operation-admin.lfeen.com',
            googleMapsApiKey: '${GOOGLE_MAPS_API_KEY}',
            // Loads the Flow "report an issue" button (internal team only). Keep off for real customers.
            flowReport: false
          };
          EOF


      - name: Install dependencies
        working-directory: LFEEN.FrontEnd/package/main
        run: npm ci


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      - name: Build and Push Admin Image
        uses: docker/build-push-action@v6
        with:
          context: ./LFEEN.FrontEnd/package/main
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}


  deploy:
    needs: build-and-push

    runs-on: ubuntu-latest

    environment: Lfeen-Production

    steps:

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.PRODUCTION_HOST }}" >> ~/.ssh/known_hosts


      - name: Deploy Admin
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'

            set -e

            echo "Connected successfully"

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io \
              -u "${{ secrets.GHCR_USERNAME }}" \
              --password-stdin

            cd /opt/lfeen

            docker compose pull admin-web

            docker compose up -d --no-deps admin-web

            docker compose ps

          EOF
