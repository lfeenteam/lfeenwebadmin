name: Deploy Angular Frontend

on:
  push:
    branches:
      - Noran

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LFEEN.FrontEnd/package/main/package-lock.json

      - name: Install dependencies
        working-directory: LFEEN.FrontEnd/package/main
        run: npm ci

      - name: Inject Testing Google Maps API Key
        working-directory: LFEEN.FrontEnd/package/main
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.TEST_GOOGLE_API_KEY }}
        run: |
          sed -i "s|__GOOGLE_MAPS_API_KEY__|${GOOGLE_MAPS_API_KEY}|g" src/environments/environment.test.ts

      - name: Build Angular
        working-directory: LFEEN.FrontEnd/package/main
        run: npm run build -- --configuration test

      - name: Add CNAME
        run: |
          echo "myadminlf.roydigi.com" > \
          LFEEN.FrontEnd/package/main/dist/Spike/browser/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: LFEEN.FrontEnd/package/main/dist/Spike/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy
        uses: actions/deploy-pages@v4
