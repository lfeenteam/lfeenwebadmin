<div class="row m-b-24">
  @for(stat of stats; track stat.label; let i = $index) {
  <div class="col-sm-6 stat-col"
    [style.--i]="i"
    [class.col-lg-6]="stats.length === 2"
    [class.col-lg-4]="isDeptView || stats.length === 3"
    [class.col-lg-3]="!isDeptView && stats.length === 4">
    <mat-card class="border stat-card stat-{{stat.color}}">
      <mat-card-content class="stat-card-content d-flex align-items-center gap-12">
        <div class="stat-icon-wrapper d-flex align-items-center justify-content-center bg-light-{{stat.color}} text-{{stat.color}}">
          @if (stat.icon.startsWith('assets')) {
            <img [src]="stat.icon" class="icon-24" alt="" />
          } @else {
            <i-tabler [name]="stat.icon" class="icon-24"></i-tabler>
          }
        </div>
        <div class="stat-text">
          <span class="stat-label d-block text-start">{{ stat.label | translate }}</span>
          <h2 class="stat-value m-0 text-start" [style.color]="stat.valueColor" [appCountUp]="stat.value"></h2>
        </div>
      </mat-card-content>
    </mat-card>
  </div>
  }
</div>
