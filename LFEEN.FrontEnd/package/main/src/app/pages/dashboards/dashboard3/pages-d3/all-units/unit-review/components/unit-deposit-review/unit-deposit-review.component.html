<div class="unit-deposit-review" [dir]="currentDir">

  <section class="deposit-card">
    <div class="deposit-icon-box">
      <i-tabler name="shield-check"></i-tabler>
    </div>

    <span class="deposit-label">{{ 'd3.unitReview.depositView.amountLabel' | translate }}</span>

    <div class="deposit-amount">
      <strong>{{ depositAmount }}</strong>
      <img [src]="currencyIconSrc" alt="ريال" class="riyal-icon" [class.is-text-currency]="currentLang === 'en'">
      
    </div>

    <div class="deposit-notice">
      <i-tabler name="info-circle"></i-tabler>
      <p>{{ 'd3.unitReview.depositView.notice' | translate }}</p>
    </div>

    <div class="deposit-check">
      <i-tabler name="circle-check"></i-tabler>
      <span>{{ 'd3.unitReview.depositView.systemCheck' | translate }}</span>
    </div>
  </section>

  <section class="notes-section">
    <div class="notes-label-row">
      <span class="notes-title">{{ 'd3.unitReview.depositView.notesLabel' | translate }}</span>
    </div>
    <div class="notes-input-wrap">
      <i-tabler name="message-2"></i-tabler>
      <textarea
        [(ngModel)]="rejectionNote"
        [placeholder]="'d3.unitReview.depositView.notesPlaceholder' | translate"
        rows="3">
      </textarea>
    </div>
  </section>

  <div class="action-buttons">
    <button class="btn btn-reject" type="button" (click)="submitDecision('rejected')">
      <span>{{ 'd3.unitReview.depositView.rejectBtn' | translate }}</span>
      <i-tabler name="circle-x"></i-tabler>
    </button>
    <button class="btn btn-approve" type="button" (click)="submitDecision('approved')">
      <span>{{ 'd3.unitReview.depositView.approveBtn' | translate }}</span>
      <i-tabler name="circle-check"></i-tabler>
    </button>
  </div>

</div>
