<div class="account-header-box d-flex align-items-center gap-16 flex-wrap">

  <!-- Search -->
  <div class="search-wrapper position-relative flex-grow-1">
    <i-tabler name="search" class="icon-18 search-icon"></i-tabler>
    <input
      type="text"
      class="search-input"
      [placeholder]="'d3.accountManagement.searchPlaceholder' | translate"
      [value]="searchQuery"
      (input)="searchQueryChange.emit($any($event.target).value)" />
  </div>

  <!-- Status filter -->
  <mat-select
    class="filter-select-native"
    [value]="selectedStatus"
    disableOptionCentering
    panelClass="team-filter-panel"
    (selectionChange)="onStatusChange($event.value)">
    @for (opt of statusOptions; track opt.value) {
      <mat-option [value]="opt.value">{{ opt.label | translate }}</mat-option>
    }
  </mat-select>

  <!-- Sort order -->
  <mat-select
    class="filter-select-native"
    [value]="newestFirst"
    disableOptionCentering
    panelClass="team-filter-panel"
    (selectionChange)="onSortChange($event.value)">
    @for (opt of sortOptions; track opt.value) {
      <mat-option [value]="opt.value">{{ opt.label | translate }}</mat-option>
    }
  </mat-select>

</div>
