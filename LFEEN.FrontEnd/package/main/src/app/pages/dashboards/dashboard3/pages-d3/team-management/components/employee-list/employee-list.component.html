<div class="employees-table-container border rounded-40 m-b-24">
  @if (showHeader) {
    <!-- One toolbar: title + count on one side, search + add on the other -->
    <div class="d-flex align-items-center justify-content-between flex-wrap gap-16 table-header-section">
      <div class="table-title d-flex align-items-center gap-10">
        <h3 class="m-0 f-s-20 f-w-900">{{ title || ('d3.teamManagement.deptEmployees' | translate) }}</h3>
        <span class="count-chip">{{ totalCount || employees.length }}</span>
      </div>
      <div class="table-tools d-flex align-items-center gap-12">
        <div class="search-wrapper position-relative">
          <i-tabler name="search" class="icon-18 search-icon position-absolute"></i-tabler>
          <input type="text" class="form-control search-input" [(ngModel)]="searchQuery" (ngModelChange)="onSearch($event)" [placeholder]="'d3.teamManagement.searchPlaceholderSimple' | translate">
        </div>
        @if (showAdd) {
          <button type="button" class="add-btn" (click)="addEmployee.emit()">
            <i-tabler name="user-plus" class="icon-18"></i-tabler>
            <span>{{ 'd3.teamManagement.addEmployee' | translate }}</span>
          </button>
        }
      </div>
    </div>
  }

  <app-all-employees [employees]="employees" [hasFilters]="hasFilters" [canManage]="canManage" (clearFilters)="onClearFilters()" (edit)="onEdit($event)" (delete)="onDelete($event)" (toggleStatus)="onToggleStatus($event)" (addEmployee)="addEmployee.emit()"></app-all-employees>

  @if (totalPages > 1) {
    <div class="pagination-wrapper d-flex align-items-center justify-content-between p-x-32 p-y-16">
      <span class="f-s-13 text-muted">
        {{ 'd3.teamManagement.pagination.total' | appPlural: totalCount }}
      </span>
      <div class="d-flex align-items-center gap-4">
        <button type="button" class="page-nav-btn" [attr.aria-label]="'common.pagination.previousPage' | translate"
          [disabled]="currentPage === 1"
          (click)="changePage(currentPage - 1)">
          <i-tabler name="chevron-left" class="icon-18 dir-icon"></i-tabler>
        </button>
        @for (p of pageNumbers; track p) {
          <button type="button" class="page-number-btn"
            [class.active]="p === currentPage"
            (click)="changePage(p)">
            {{ p }}
          </button>
        }
        <button type="button" class="page-nav-btn" [attr.aria-label]="'common.pagination.nextPage' | translate"
          [disabled]="currentPage === totalPages"
          (click)="changePage(currentPage + 1)">
          <i-tabler name="chevron-right" class="icon-18 dir-icon"></i-tabler>
        </button>
      </div>
    </div>
  }
</div>
