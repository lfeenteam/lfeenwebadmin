<div class="cp-dialog" [dir]="currentDir">

  <div class="cp-header">
    <div class="cp-header-info">
      <div class="cp-lock-icon">
        <i-tabler name="lock" class="icon-20"></i-tabler>
      </div>
      <div>
        <h2 class="cp-title">{{ 'd3.profile.changePasswordDialog.title' | translate }}</h2>
        <p class="cp-subtitle">{{ 'd3.profile.changePasswordDialog.subtitle' | translate }}</p>
      </div>
    </div>
    <button class="cp-close-btn" type="button" (click)="dialogRef.close()">
      <i-tabler name="x" class="icon-18"></i-tabler>
    </button>
  </div>

  <mat-dialog-content class="cp-content">
    <form [formGroup]="form">

      <!-- Current Password -->
      <div class="cp-field">
        <label>{{ 'd3.profile.changePasswordDialog.currentPassword' | translate }}</label>
        <mat-form-field appearance="outline" class="w-100 cp-form-field">
          <input matInput formControlName="currentPassword"
            [type]="showCurrent ? 'text' : 'password'"
            [placeholder]="'d3.profile.changePasswordDialog.currentPasswordPlaceholder' | translate" />
          <button mat-icon-button matSuffix type="button" (click)="showCurrent = !showCurrent">
            <i-tabler [name]="showCurrent ? 'eye-off' : 'eye'" class="icon-18 text-muted"></i-tabler>
          </button>
        </mat-form-field>
      </div>

      <!-- New Password -->
      <div class="cp-field">
        <label>{{ 'd3.profile.changePasswordDialog.newPassword' | translate }}</label>
        <mat-form-field appearance="outline" class="w-100 cp-form-field">
          <input matInput formControlName="newPassword"
            [type]="showNew ? 'text' : 'password'"
            placeholder="••••••••" />
          <button mat-icon-button matSuffix type="button" (click)="showNew = !showNew">
            <i-tabler [name]="showNew ? 'eye-off' : 'eye'" class="icon-18 text-muted"></i-tabler>
          </button>
        </mat-form-field>
      </div>

      <!-- Confirm Password -->
      <div class="cp-field">
        <label>{{ 'd3.profile.changePasswordDialog.confirmPassword' | translate }}</label>
        <mat-form-field appearance="outline" class="w-100 cp-form-field">
          <input matInput formControlName="confirmPassword"
            [type]="showConfirm ? 'text' : 'password'"
            placeholder="••••••••" />
          <button mat-icon-button matSuffix type="button" (click)="showConfirm = !showConfirm">
            <i-tabler [name]="showConfirm ? 'eye-off' : 'eye'" class="icon-18 text-muted"></i-tabler>
          </button>
        </mat-form-field>
        <span class="cp-error" *ngIf="form.errors?.['passwordsMismatch'] && form.get('confirmPassword')?.touched">
          {{ 'd3.profile.changePasswordDialog.mismatch' | translate }}
        </span>
      </div>

      <!-- Hint -->
      <div class="cp-hint">
        <i-tabler name="info-circle" class="icon-16"></i-tabler>
        <span>{{ 'd3.profile.changePasswordDialog.hint' | translate }}</span>
      </div>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions class="cp-actions">
    <button class="cp-save-btn" type="button" [disabled]="saving" (click)="save()">
      {{ (saving ? 'd3.profile.changePasswordDialog.saving' : 'd3.profile.changePasswordDialog.save') | translate }}
    </button>
    <button class="cp-cancel-btn" type="button" [disabled]="saving" (click)="dialogRef.close()">
      {{ 'd3.profile.changePasswordDialog.cancel' | translate }}
    </button>
  </mat-dialog-actions>

</div>
