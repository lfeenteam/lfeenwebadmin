<div class="all-builds-page" [dir]="currentDir">
<app-dashboard-sub-header
  [metrics]="metrics"
  [tabs]="tabs"
  [filterOptions]="filterOptions"
  [searchPlaceholder]="searchPlaceholder"
  [activeTab]="activeTab"
  [searchQuery]="searchQuery"
  [viewMode]="viewMode"
  (activeTabChange)="onTabChange($event)"
  (searchQueryChange)="onSearch($event)"
  (filtersChange)="onFiltersChange($event)"
  (viewModeChange)="setViewMode($event)">
</app-dashboard-sub-header>

@if (isLoading) {
  <app-dashboard-loading [rows]="6"></app-dashboard-loading>
} @else {
  <app-cards-builds [buildings]="filteredBuildings" [viewMode]="viewMode" [activeTab]="activeTab"></app-cards-builds>
}

@if (!isLoading && totalPages > 1) {
  <div class="pagination-wrapper">
    <span class="pagination-total">
      {{ totalCount }} {{ 'd3.allBuilds.pagination.total' | translate }}
    </span>
    <div class="pagination-controls">
      <button class="page-nav-btn"
        [disabled]="currentPage === 1"
        (click)="changePage(currentPage - 1)">
        <i-tabler [name]="currentDir === 'rtl' ? 'chevron-right' : 'chevron-left'" class="icon-18"></i-tabler>
      </button>

      @for (item of visiblePages; track $index) {
        @if (item === '...') {
          <span class="page-ellipsis">...</span>
        } @else {
          <button class="page-number-btn"
            [class.active]="currentPage === item"
            (click)="changePage($any(item))">
            {{ item }}
          </button>
        }
      }

      <button class="page-nav-btn"
        [disabled]="currentPage === totalPages"
        (click)="changePage(currentPage + 1)">
        <i-tabler [name]="currentDir === 'rtl' ? 'chevron-left' : 'chevron-right'" class="icon-18"></i-tabler>
      </button>
    </div>
  </div>
}
</div>
