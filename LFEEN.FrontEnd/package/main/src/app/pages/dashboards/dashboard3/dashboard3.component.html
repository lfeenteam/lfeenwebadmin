<div class="dashboard-wrapper d-flex" [attr.dir]="currentDir()" [class.sidebar-mobile-open]="sidebarMobileOpen">
  <!-- Sidebar -->
  @if (!isLoginRoute) {
    <app-dashboard3-sidebar
      class="dashboard-sidebar"
      [attr.dir]="currentDir()"
      [(collapsed)]="sidebarCollapsed"
    
      [mobileMode]="sidebarMobileOpen"
      (mobileClose)="closeMobileSidebar()"></app-dashboard3-sidebar>
  }

  <!-- Mobile overlay -->
  @if (!isLoginRoute) {
    <div class="sidebar-overlay" (click)="closeMobileSidebar()"></div>
  }

  <!-- Main Content -->
  <div class="content-area flex-grow-1 d-flex flex-column">
    <!-- Header -->
    @if (!isLoginRoute) {
      @if (headerType === 'ceo') {
        <app-dashboard3-header (sidebarToggle)="toggleMobileSidebar()"></app-dashboard3-header>
      } @else if (pageTitleKey) {
        <app-dashboard3-page-header
          [titleKey]="pageTitleKey"
          [titleOverride]="pageTitleOverrideText"
          [extraCrumbs]="pageExtraCrumbs"
          [breadcrumbKey]="pageBreadcrumbKey"
          [breadcrumbRoute]="pageBreadcrumbRoute"
          [breadcrumbQueryParams]="pageBreadcrumbQueryParams"
          [showLive]="pageShowLive"
          [showDate]="pageShowDate"
          [showBack]="pageShowBack"
          [statusBadge]="pageStatusBadge"
          [actionButton]="pageActionButton"
          (sidebarToggle)="toggleMobileSidebar()"
          (back)="onPageBack()"
          (action)="onPageAction($event)">
        </app-dashboard3-page-header>
      }
    }

    <!-- Routed Page Content -->
    <div class="page-content" [class.p-0]="isLoginRoute">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
