<div class="account-management-container">

  <!-- Stats -->
  <app-stats-row [stats]="stats"></app-stats-row>

  <!-- Search + Filter header -->
  <app-account-header
    [searchQuery]="searchQuery"
    [activeTab]="activeTab"
    [newestFirst]="newestFirst"
    (searchQueryChange)="onSearchChange($event)"
    (tabChange)="setActiveTab($event)"
    (sortChange)="onSortChange($event)">
  </app-account-header>

  <!-- Tabs -->
  <div class="border-bottom-gray m-b-24">
    <app-account-tabs-bar
      [activeTab]="activeTab"
      (tabChange)="setActiveTab($event)">
    </app-account-tabs-bar>
  </div>

  <!-- Loading -->
  @if (isLoading) {
    <div class="d-flex justify-content-center align-items-center p-48">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
  }

  <!-- Cards grid -->
  @if (!isLoading) {
    <div class="row">
      @for (account of filteredAccounts; track account.id) {
        <div class="col-md-6 col-lg-4 m-b-8">
          <app-account-card [account]="account"></app-account-card>
        </div>
      }
      @empty {
        <div class="col-12 empty-state d-flex flex-column align-items-center justify-content-center p-48">
          <span class="f-s-14 text-muted">{{ 'd3.accountManagement.noResults' | translate }}</span>
        </div>
      }
    </div>

    <!-- Pagination -->
    @if (totalPages > 1) {
      <div class="d-flex justify-content-center align-items-center gap-8 m-t-16">
        <button mat-icon-button [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">
          <i-tabler name="chevron-right" class="icon-18"></i-tabler>
        </button>
        @for (page of pageNumbers; track page) {
          <button
            mat-button
            class="page-btn"
            [class.active-page]="currentPage === page"
            (click)="changePage(page)">
            {{ page }}
          </button>
        }
        <button mat-icon-button [disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">
          <i-tabler name="chevron-left" class="icon-18"></i-tabler>
        </button>
      </div>
    }
  }

</div>
