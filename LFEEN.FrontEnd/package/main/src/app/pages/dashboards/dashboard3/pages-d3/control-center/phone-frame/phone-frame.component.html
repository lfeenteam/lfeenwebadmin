<div class="pf-phone" aria-hidden="true">
  <span class="pf-btn pf-btn-silent"></span>
  <span class="pf-btn pf-btn-vol-up"></span>
  <span class="pf-btn pf-btn-vol-down"></span>
  <span class="pf-btn pf-btn-power"></span>

  <div class="pf-screen">
    <!-- A real status bar never mirrors, so it stays LTR in Arabic too. -->
    <div class="pf-status" dir="ltr">
      <span class="pf-time">{{ time }}</span>
      <span class="pf-camera"></span>
      <span class="pf-indicators">
        <svg class="pf-signal" viewBox="0 0 17 11"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg class="pf-wifi" viewBox="0 0 16 11"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.1-1.1A9.9 9.9 0 0 0 8 .6 9.9 9.9 0 0 0 .9 3.5L2 4.6a8.4 8.4 0 0 1 6-2.4Zm0 3.2c1.4 0 2.7.5 3.7 1.4l1.1-1.1A7 7 0 0 0 8 3.8a7 7 0 0 0-4.8 1.9l1.1 1.1c1-.9 2.3-1.4 3.7-1.4Zm0 3.2c.6 0 1.1.2 1.5.6L8 10.7 6.5 9.2c.4-.4.9-.6 1.5-.6Z"/></svg>
        <span class="pf-battery"><span class="pf-battery-level"></span></span>
      </span>
    </div>

    <div class="pf-content">
      <ng-content></ng-content>
    </div>

    <span class="pf-home"></span>
  </div>
</div>
