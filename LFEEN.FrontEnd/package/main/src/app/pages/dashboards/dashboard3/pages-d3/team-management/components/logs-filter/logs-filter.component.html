<div class="logs-filter-box d-flex align-items-center gap-16 flex-wrap m-b-24">

  <!-- Search -->
  <div class="logs-search-wrapper position-relative flex-grow-1">
    <i-tabler name="search" class="icon-18 logs-search-icon"></i-tabler>
    <input type="text" class="logs-search-input"
           [placeholder]="'d3.teamManagement.opsLog.filters.searchPlaceholder' | translate"
           (input)="searchQueryChange.emit($any($event.target).value)" />
  </div>

  <!-- Action Type -->
  <select class="filter-select-native" (change)="filterActionChange.emit($any($event.target).value)">
    <option value="">{{ 'd3.teamManagement.opsLog.filters.actionType' | translate }}</option>
    @for (code of actionCodes; track code) {
      <option [value]="code">{{ 'd3.teamManagement.opsLog.actions.' + code | translate }}</option>
    }
  </select>

  <!-- Departments -->
  <select class="filter-select-native" (change)="filterDeptChange.emit($any($event.target).value)">
    <option value="">{{ 'd3.teamManagement.opsLog.filters.allDepts' | translate }}</option>
    @for (opt of depts; track opt.value) {
      <option [value]="opt.value">{{ opt.label }}</option>
    }
  </select>

  <!-- Status -->
  <select class="filter-select-native" (change)="filterStatusChange.emit($any($event.target).value)">
    <option value="">{{ 'd3.teamManagement.opsLog.filters.allStatuses' | translate }}</option>
    @for (status of statuses; track status) {
      <option [value]="status">{{ 'd3.teamManagement.opsLog.status.' + status | translate }}</option>
    }
  </select>

  <!-- Dates -->
  <select class="filter-select-native" (change)="filterDateChange.emit($any($event.target).value)">
    <option value="">{{ 'd3.teamManagement.opsLog.filters.allDates' | translate }}</option>
    @for (preset of datePresets; track preset) {
      <option [value]="preset">{{ 'd3.teamManagement.opsLog.filters.dates.' + preset | translate }}</option>
    }
  </select>

</div>
