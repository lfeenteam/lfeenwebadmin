<div class="complaint-page" [dir]="currentDir">

  <!-- Tabs -->
  <div class="tabs-row border-bottom-gray">
    <app-complaint-tabs-bar
      [activeTab]="activeTab()"
      (tabChange)="setTab($event)">
    </app-complaint-tabs-bar>
  </div>

  <div class="content-area" [class.chat-open]="chatOpen && (activeTab() !== 'resolved' || selectedComplaint()?.type === 'customer')">

    <div class="table-column">
      <app-complaints-table
        [activeTab]="activeTab()"
        [complaints]="visibleComplaints()"
        [selectedId]="selectedComplaint()?.id ?? null"
        [compact]="chatOpen"
        [loading]="loading()"
        [serverTotalCount]="activeTab() === 'customers' ? customerTotalCount() : (activeTab() === 'resolved' ? resolvedTotalCount() : null)"
        [serverTotalPages]="activeTab() === 'customers' ? customerTotalPages() : (activeTab() === 'resolved' ? resolvedTotalPages() : null)"
        [serverCurrentPage]="activeTab() === 'customers' ? customerPage() : (activeTab() === 'resolved' ? resolvedPage() : null)"
        [statusFilterValue]="activeTab() === 'customers' ? customerStatus() : null"
        [statusOptions]="activeTab() === 'customers' ? clientStatusOptions : []"
        (rowSelect)="onRowSelect($event)"
        (detailSelect)="openHostComplaint($event)"
        (searchChange)="activeTab() === 'customers' ? onCustomerSearchChange($event) : onResolvedSearchChange($event)"
        (statusFilterChange)="onCustomerStatusChange($event)"
        (pageChange)="activeTab() === 'customers' ? onCustomerPageChange($event) : onResolvedPageChange($event)">
      </app-complaints-table>
    </div>

    @if (chatOpen && (activeTab() !== 'resolved' || selectedComplaint()?.type === 'customer')) {
      <div class="chat-column">
        <app-complaint-chat
          [complaint]="selectedComplaint()!"
          [viewOnly]="activeTab() === 'resolved'"
          (close)="closeChat()"
          (resolve)="onResolve(selectedComplaint()!)">
        </app-complaint-chat>
      </div>
    }

  </div>

</div>
