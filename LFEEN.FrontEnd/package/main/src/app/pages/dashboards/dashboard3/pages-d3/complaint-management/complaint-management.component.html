<div class="complaint-page" [dir]="currentDir">

  <!-- Tabs -->
  <div class="tabs-row border-bottom-gray">
    <app-complaint-tabs-bar
      [activeTab]="activeTab()"
      (tabChange)="setTab($event)">
    </app-complaint-tabs-bar>
  </div>

  <div class="content-area" [class.chat-open]="chatOpen && (activeTab() !== 'resolved' || selectedComplaint()?.type === 'customer')">

    <div class="table-column">
      @if (activeTab() === 'customers' || activeTab() === 'hosts') {
        <div class="assign-warning">
          <i-tabler name="info-circle" class="icon-16"></i-tabler>
          <span>{{ 'd3.complaints.table.assignHint' | translate }}</span>
        </div>
      }
      <app-complaints-table
        [activeTab]="activeTab()"
        [complaints]="visibleComplaints()"
        [selectedId]="selectedComplaint()?.id ?? null"
        [compact]="chatOpen"
        [loading]="loading()"
        [serverTotalCount]="activeTab() === 'customers' ? customerTotalCount() : (activeTab() === 'hosts' ? hostTotalCount() : (activeTab() === 'resolved' ? resolvedTotalCount() : null))"
        [serverTotalPages]="activeTab() === 'customers' ? customerTotalPages() : (activeTab() === 'hosts' ? hostTotalPages() : (activeTab() === 'resolved' ? resolvedTotalPages() : null))"
        [serverCurrentPage]="activeTab() === 'customers' ? customerPage() : (activeTab() === 'hosts' ? hostPage() : (activeTab() === 'resolved' ? resolvedPage() : null))"
        [statusFilterValue]="activeTab() === 'customers' ? customerStatus() : (activeTab() === 'hosts' ? hostStatus() : resolvedType())"
        [statusOptions]="activeTab() === 'customers' ? clientStatusOptions : (activeTab() === 'hosts' ? hostStatusOptions : resolvedTypeOptions)"
        [allOptionLabelKey]="activeTab() === 'resolved' ? 'd3.complaints.table.allTypes' : 'd3.complaints.table.allStatuses'"
        (rowSelect)="onRowSelect($event)"
        (detailSelect)="openHostComplaint($event)"
        (assignClick)="onAssignClick($event)"
        (searchChange)="activeTab() === 'customers' ? onCustomerSearchChange($event) : (activeTab() === 'hosts' ? onHostSearchChange($event) : onResolvedSearchChange($event))"
        (statusFilterChange)="activeTab() === 'hosts' ? onHostStatusChange($event) : (activeTab() === 'resolved' ? onResolvedTypeChange($event) : onCustomerStatusChange($event))"
        (pageChange)="activeTab() === 'customers' ? onCustomerPageChange($event) : (activeTab() === 'hosts' ? onHostPageChange($event) : onResolvedPageChange($event))">
      </app-complaints-table>
    </div>

    @if (chatOpen && (activeTab() !== 'resolved' || selectedComplaint()?.type === 'customer')) {
      <div class="chat-column">
        <app-complaint-chat
          [complaint]="selectedComplaint()!"
          [viewOnly]="activeTab() === 'resolved'"
          (close)="closeChat()"
          (resolve)="onResolve(selectedComplaint()!)">
        </app-complaint-chat>
      </div>
    }

  </div>

</div>
