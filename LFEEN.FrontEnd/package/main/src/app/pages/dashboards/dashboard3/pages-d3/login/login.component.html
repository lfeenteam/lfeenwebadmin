<div class="login-container" [dir]="currentDir">
  <!-- Left Side: Illustration and Text -->
  <div class="login-sidebar">
    <div class="sidebar-content">
      <div class="illustration-wrapper">
        <img src="assets/images/backgrounds/login_image1.png" alt="Dashboard Illustration" class="login-illustration" />
      </div>
      <div class="sidebar-text">
        <h1 class="sidebar-title">{{ 'd3.loginPage.sidebar.title1' | translate }}</h1>
        <h1 class="sidebar-title">{{ 'd3.loginPage.sidebar.title2' | translate }}</h1>
        <p class="sidebar-description">
          {{ 'd3.loginPage.sidebar.description' | translate }}
        </p>
      </div>
    </div>
  </div>

  <!-- Right Side: Login Form -->
  <div class="login-form-container">
    <div class="login-form-content">
      <div class="logo-wrapper">
        <img src="assets/images/logos/Layer_x0020_1.png" alt="LFEEN Logo" class="logo" />
      </div>

      <div class="form-header">
        <h2 class="form-title">{{ 'd3.loginPage.form.title' | translate }}</h2>
        <p class="form-subtitle">{{ 'd3.loginPage.form.subtitle' | translate }}</p>
      </div>

      <form class="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email Field -->
        <div class="field-group">
          <label class="field-label">{{ 'd3.loginPage.form.emailLabel' | translate }}</label>
          <div class="input-control">
            <i-tabler name="mail" class="icon-20"></i-tabler>
            <input type="email" placeholder="admin@lafin.sa" formControlName="email" />
          </div>
        </div>

        <!-- Password Field -->
        <div class="field-group">
          <div class="label-row">
            <label class="field-label">{{ 'd3.loginPage.form.passwordLabel' | translate }}</label>
            <a href="javascript:void(0)" class="forgot-password">{{ 'd3.loginPage.form.forgotPassword' | translate }}</a>
          </div>
          <div class="input-control">
            <i-tabler name="lock" class="icon-20"></i-tabler>
            <input [type]="hide ? 'password' : 'text'" placeholder="........" formControlName="password" />
            <button
              type="button"
              class="password-toggle"
              (click)="hide = !hide"
              [attr.aria-label]="'Hide password'"
              [attr.aria-pressed]="hide">
              <i-tabler [name]="hide ? 'eye-off' : 'eye'" class="icon-20"></i-tabler>
            </button>
          </div>
        </div>

        <!-- Remember Me -->
        <div class="remember-me-row">
          <label class="remember-checkbox">
            <input type="checkbox" formControlName="rememberMe" />
            <span class="checkmark" aria-hidden="true">
              <i-tabler name="check" class="check-icon"></i-tabler>
            </span>
            <span class="remember-label">{{ 'd3.loginPage.form.rememberMe' | translate }}</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button mat-flat-button color="primary" class="login-button" type="submit" [disabled]="loginForm.invalid || loading()">
          <div class="button-content">
            @if (loading()) {
              <mat-spinner diameter="20" color="accent"></mat-spinner>
            } @else {
              <span>{{ 'd3.loginPage.form.submit' | translate }}</span>
              <i-tabler [name]="currentDir === 'rtl' ? 'arrow-left' : 'arrow-right'" class="icon-20"></i-tabler>
            }
          </div>
        </button>
      </form>
    </div>
  </div>
</div>
