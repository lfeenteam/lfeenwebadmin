<div class="d3-empty-state">

  <!-- Illustration -->
  @if (imageSrc) {
    <img [src]="imageSrc" alt="" class="d3-empty-state__img" aria-hidden="true" />
  } @else {
    <div class="d3-empty-state__icon-wrap" aria-hidden="true">
      <i-tabler [name]="resolvedIcon" class="d3-empty-state__icon"></i-tabler>
    </div>
  }

  <p class="d3-empty-state__title">{{ titleKey | translate }}</p>
  <p class="d3-empty-state__desc">{{ descKey | translate }}</p>

  @if (actionKey) {
    <button type="button" class="d3-empty-state__action" (click)="action.emit()">
      @if (actionIcon) {
        <i-tabler [name]="actionIcon" class="d3-empty-state__action-icon"></i-tabler>
      }
      {{ actionKey | translate }}
    </button>
  }

  <!-- Optional extra content (e.g. a custom button) -->
  <ng-content></ng-content>
</div>
