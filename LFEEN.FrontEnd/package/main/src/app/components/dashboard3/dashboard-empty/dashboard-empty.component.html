<div class="d3-empty-state">

  <!-- Illustration -->
  @if (imageSrc) {
    <img [src]="imageSrc" alt="" class="d3-empty-state__img" aria-hidden="true" />
  } @else if (icon) {
    <div class="d3-empty-state__icon-wrap">
      <i-tabler [name]="icon" class="d3-empty-state__icon"></i-tabler>
    </div>
  } @else {
    <div class="d3-empty-state__art">
      <svg viewBox="0 0 200 176" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="d3-empty-state__svg">
        <!-- Shadow blob -->
        <ellipse cx="100" cy="164" rx="66" ry="9" fill="#E4E4E0" opacity="0.7"/>

        <!-- Building body -->
        <rect x="36" y="56" width="128" height="104" rx="14" fill="#F5F5F3" stroke="#DDDDD8" stroke-width="1.6"/>

        <!-- Roof -->
        <path d="M24 62 L100 20 L176 62" stroke="#CFCFCA" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

        <!-- Door -->
        <rect x="76" y="112" width="48" height="48" rx="10" fill="#EAEAE6" stroke="#D4D4CF" stroke-width="1.4"/>
        <!-- Door knob -->
        <circle cx="118" cy="136" r="3" fill="#BEBEBA"/>

        <!-- Windows row 1 -->
        <rect x="46" y="68" width="30" height="22" rx="6" fill="#E8E8E4" stroke="#D4D4CF" stroke-width="1.2"/>
        <rect x="124" y="68" width="30" height="22" rx="6" fill="#E8E8E4" stroke="#D4D4CF" stroke-width="1.2"/>

        <!-- Windows row 2 -->
        <rect x="46" y="98" width="30" height="22" rx="6" fill="#E8E8E4" stroke="#D4D4CF" stroke-width="1.2"/>
        <rect x="124" y="98" width="30" height="22" rx="6" fill="#E8E8E4" stroke="#D4D4CF" stroke-width="1.2"/>

        <!-- X marks on windows (empty feel) -->
        <line x1="50" y1="72"  x2="72" y2="86"  stroke="#C8C8C2" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="72" y1="72"  x2="50" y2="86"  stroke="#C8C8C2" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="128" y1="72" x2="150" y2="86" stroke="#C8C8C2" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="150" y1="72" x2="128" y2="86" stroke="#C8C8C2" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="50" y1="102" x2="72" y2="116" stroke="#C8C8C2" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="72" y1="102" x2="50" y2="116" stroke="#C8C8C2" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="128" y1="102" x2="150" y2="116" stroke="#C8C8C2" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="150" y1="102" x2="128" y2="116" stroke="#C8C8C2" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
    </div>
  }

  <p class="d3-empty-state__title">{{ titleKey | translate }}</p>
  <p class="d3-empty-state__desc">{{ descKey | translate }}</p>
</div>
