<header class="d3-header" [attr.dir]="isRtl() ? 'rtl' : 'ltr'">
  <!-- Start: menu (mobile) + page title -->
  <div class="d3-header-start">
    <button class="d3-icon-btn d3-sidebar-toggle d3-mh" type="button" (click)="onSidebarToggle($event)"
            [attr.aria-label]="'d3.header.openMenu' | translate">
      <app-d3-icon name="menu"></app-d3-icon>
    </button>

    <div class="d3-header-heading">
      <h1 class="d3-header-title">{{ 'd3.header.title' | translate }}</h1>
      <span class="d3-header-date">{{ currentDate }}</span>
    </div>

    <!-- Connection: browser connectivity, with a tooltip saying what it means -->
    <span class="d3-conn" [class.is-offline]="!isOnline()" role="status"
          [matTooltip]="(isOnline() ? 'd3.header.onlineHint' : 'd3.header.offlineHint') | translate"
          matTooltipPosition="below" tabindex="0">
      <span class="d3-conn-dot" aria-hidden="true"></span>
      <span class="d3-conn-text">{{ (isOnline() ? 'd3.header.online' : 'd3.header.offline') | translate }}</span>
    </span>
  </div>

  <!-- End: notifications, language, account (shared with every page header) -->
  <app-d3-header-actions></app-d3-header-actions>
</header>
