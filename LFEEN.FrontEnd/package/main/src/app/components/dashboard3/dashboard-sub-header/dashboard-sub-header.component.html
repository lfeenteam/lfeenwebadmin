<div class="metrics-container">
  <section class="sub-header-metrics">
    @for (card of metrics; track card.titleKey) {
      <article class="metric-card">
        <div class="metric-content">
          <p class="metric-title">{{ card.titleKey | translate }}</p>
          <h3 class="metric-value" [ngClass]="card.tone">{{ card.value }}</h3>
        </div>

        <span class="metric-icon" [ngClass]="card.tone">
          <i-tabler [name]="card.icon"></i-tabler>
        </span>
      </article>
    }
  </section>
</div>

<div class="tabs-filter-container">
  <app-tabs-filter
    [activeTab]="activeTab"
    [searchQuery]="searchQuery"
    [tabs]="tabs"
    [filterOptions]="filterOptions"
    [searchPlaceholder]="searchPlaceholder"
    [activeFilters]="activeFilters"
    [serverSearchFilterIds]="serverSearchFilterIds"
    (activeTabChange)="selectTab($event)"
    (searchQueryChange)="onSearch($event)"
    (filtersChange)="onFiltersChange($event)"
    (filterSearchChange)="filterSearchChange.emit($event)">
  </app-tabs-filter>

  <div class="view-toggle-row">
    <div class="view-toggle" role="group" [attr.aria-label]="'d3.allBuilds.viewToggle.label' | translate">
      <button
        type="button"
        class="view-btn"
        [class.active]="viewMode === 'list'"
        [attr.aria-pressed]="viewMode === 'list'"
        [attr.aria-label]="'d3.allBuilds.viewToggle.list' | translate"
        (click)="setViewMode('list')">
        <i-tabler name="list"></i-tabler>
      </button>
      <button
        type="button"
        class="view-btn"
        [class.active]="viewMode === 'grid'"
        [attr.aria-pressed]="viewMode === 'grid'"
        [attr.aria-label]="'d3.allBuilds.viewToggle.grid' | translate"
        (click)="setViewMode('grid')">
        <i-tabler name="layout-grid"></i-tabler>
      </button>
    </div>
  </div>
</div>
